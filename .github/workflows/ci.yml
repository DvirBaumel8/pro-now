# Runs on every push and pull request (/docs/16-DEPLOYMENT.md §CI).
# Free for this repository within GitHub's monthly Actions minutes.
name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, typecheck, unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # Nothing in apps/api compiles until the Prisma client exists.
      - run: npm run db:generate -w apps/api
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run verify:domain

  database:
    name: Migrations and row lock on real Postgres + PostGIS
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: pronow
          POSTGRES_PASSWORD: pronow_ci_only
          POSTGRES_DB: pronow
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U pronow"
          --health-interval 5s --health-timeout 5s --health-retries 10
      # Stand-ins the sign-in tests talk to (same images as docker-compose.yml).
      mailpit:
        image: axllent/mailpit:v1.31.3
        ports: ["1025:1025", "8025:8025"]
      oidc:
        image: ghcr.io/navikt/mock-oauth2-server:6.0.4
        env:
          SERVER_PORT: "8080"
          JSON_CONFIG: '{"interactiveLogin": true}'
        ports: ["8089:8080"]
    env:
      DATABASE_URL: postgresql://pronow:pronow_ci_only@localhost:5432/pronow
      NODE_ENV: test
      AUTH_SECRET: ci-only-auth-secret-not-used-anywhere-0123
      PUBLIC_URL: http://localhost:4000
      SMTP_URL: smtp://localhost:1025
      EMAIL_FROM: PRO NOW <no-reply@pronow.test>
      GOOGLE_CLIENT_ID: pronow-local
      GOOGLE_CLIENT_SECRET: pronow-local-secret
      GOOGLE_ISSUER_URL: http://localhost:8089/google
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci
      - run: npm run db:generate -w apps/api
      - run: npm run db:migrate:deploy -w apps/api
      # The migrations, applied to a fresh database, must produce exactly the
      # Prisma schema. (Diffing against a live database rather than a shadow
      # one: Prisma's shadow reset on the PostGIS image misreports the
      # extension.)
      - run: npm run db:drift
      - run: npm run verify:rowlock
      # Route-level tests: every plugin and route against a throwaway, migrated database.
      - run: npm run test:int
      - run: pip install psycopg2-binary && npm run db:verify

  e2e:
    name: End-to-end (WebKit iPhone 15 + Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: pronow
          POSTGRES_PASSWORD: pronow_ci_only
          POSTGRES_DB: pronow
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U pronow"
          --health-interval 5s --health-timeout 5s --health-retries 10
      mailpit:
        image: axllent/mailpit:v1.31.3
        ports: ["1025:1025", "8025:8025"]
      oidc:
        image: ghcr.io/navikt/mock-oauth2-server:6.0.4
        env:
          SERVER_PORT: "8080"
          JSON_CONFIG: '{"interactiveLogin": true}'
        ports: ["8089:8080"]
    env:
      DATABASE_URL: postgresql://pronow:pronow_ci_only@localhost:5432/pronow
      AUTH_SECRET: ci-only-auth-secret-not-used-anywhere-0123
      SMTP_URL: smtp://localhost:1025
      EMAIL_FROM: PRO NOW <no-reply@pronow.test>
      GOOGLE_CLIENT_ID: pronow-local
      GOOGLE_CLIENT_SECRET: pronow-local-secret
      GOOGLE_ISSUER_URL: http://localhost:8089/google
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run db:generate -w apps/api
      - run: npm run db:migrate:deploy -w apps/api
      - run: npm run db:seed
      - run: npx playwright install --with-deps webkit chromium
        working-directory: apps/web
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7
