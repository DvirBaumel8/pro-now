<!doctype html>
<!--
  lang="he" dir="ltr", as in the demo (tools/design-preview/index.html).
  dir="ltr" is deliberate: the shared screens lay rows out right-to-left
  with `row-reverse`, which a dir="rtl" document would flip back. Hebrew
  text still runs right-to-left through Unicode bidi.
-->
<html lang="he" dir="ltr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#17121F" />
    <title>PRO NOW</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2317121F'/%3E%3Ccircle cx='16' cy='16' r='6' fill='%23FF6B4A'/%3E%3C/svg%3E"
    />
    <style>
      :root { color-scheme: light dark; }
      html, body, #root { height: 100%; margin: 0; }
      /* 100dvh: iOS Safari's collapsing toolbar makes 100vh taller than the screen. */
      #root { min-height: 100dvh; }
      body {
        font-family: "Noto Sans Hebrew", "Heebo", "Assistant", -apple-system,
          BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: #F2F1EC;
        padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
        box-sizing: border-box;
      }
      /* Safari zooms into any focused input under 16px. */
      input, textarea, select { font-size: max(16px, 1em); }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
